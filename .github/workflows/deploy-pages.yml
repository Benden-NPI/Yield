name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy index.html as 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Check Pages status
        id: pages-status
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status_code="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/pages-response.json \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${{ github.api_url }}/repos/${{ github.repository }}/pages"
          )"

          if [ "${status_code}" = '200' ]; then
            echo 'enabled=true' >> "${GITHUB_OUTPUT}"
          elif [ "${status_code}" = '404' ]; then
            echo 'enabled=false' >> "${GITHUB_OUTPUT}"
            echo '::warning::GitHub Pages is not enabled for this repository. Skipping Pages deployment steps.'
          else
            cat /tmp/pages-response.json
            echo "::error::Unexpected response while checking GitHub Pages status: HTTP ${status_code}"
            exit 1
          fi

      - name: Setup Pages
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
