<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Items Interface Example</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/yield.css" />
  </head>
  <body>
    <header class="topnav">
      <a href="/" class="active">工作看板</a>
      <a href="/yield.html">良率管理</a>
    </header>
    <main>
      <h1>Work Items Interface Example</h1>
      <p>Source: <code>docs/work-items/*.md</code></p>
      <section class="controls">
        <label>
          Search
          <input id="search" type="search" placeholder="Search id/title/owner/file" />
        </label>
        <label>
          Owner
          <select id="ownerFilter">
            <option value="">All owners</option>
          </select>
        </label>
        <button id="reload">Reload</button>
      </section>
      <p id="status"></p>
      <section id="board" class="board">
        <article class="column">
          <h2>Todo <span id="count-todo" class="count">0</span></h2>
          <div id="col-todo" class="column-items"></div>
        </article>
        <article class="column">
          <h2>In Progress <span id="count-in-progress" class="count">0</span></h2>
          <div id="col-in-progress" class="column-items"></div>
        </article>
        <article class="column">
          <h2>Done <span id="count-done" class="count">0</span></h2>
          <div id="col-done" class="column-items"></div>
        </article>
      </section>
    </main>
    <script src="/main.js"></script>
  </body>
</html>
